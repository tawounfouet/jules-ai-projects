{% extends "base.html" %}

{% block content %}
<h2>Room: {{ room.name }}</h2>

<div id="chat-log"
    style="border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #fff;">
    {% for message in messages %}
    <div>
        <strong>{{ message.user.username }}:</strong> {{ message.content }}
    </div>
    {% endfor %}
</div>
<div id="typing-indicator" style="height: 20px; font-style: italic; color: #888; margin-bottom: 5px;"></div>

<input id="chat-message-input" type="text" size="100" placeholder="Type your message here..."
    style="width: 80%; padding: 10px;">
<input id="chat-message-submit" type="button" value="Send" style="padding: 10px 20px;">

<div style="margin-top: 10px;">
    <a href="{% url 'index' %}">Back to Rooms</a>
</div>

{{ room.slug|json_script:"room-slug" }}
{{ user.username|json_script:"user-username" }}

<script>
    const roomSlug = JSON.parse(document.getElementById('room-slug').textContent);
    const username = JSON.parse(document.getElementById('user-username').textContent);

    const chatSocket = new WebSocket(
        'ws://'
        + window.location.host
        + '/ws/chat/'
        + roomSlug
        + '/'
    );

    chatSocket.onmessage = function (e) {
        const data = JSON.parse(e.data);

        if (data.type === 'chat_message') {
            const chatLog = document.querySelector('#chat-log');
            const messageElement = document.createElement('div');
            messageElement.innerHTML = `<strong>${data.username}:</strong> ${data.message}`;
            chatLog.appendChild(messageElement);
            chatLog.scrollTop = chatLog.scrollHeight;
        } else if (data.type === 'typing') {
            const typingIndicator = document.querySelector('#typing-indicator');
            if (data.is_typing && data.username !== username) {
                typingIndicator.textContent = `${data.username} is typing...`;
            } else if (!data.is_typing && data.username !== username) {
                typingIndicator.textContent = '';
            }
        }
    };

    chatSocket.onclose = function (e) {
        console.error('Chat socket closed unexpectedly');
    };

    document.querySelector('#chat-message-input').focus();
    document.querySelector('#chat-message-input').onkeyup = function (e) {
        if (e.keyCode === 13) {  // enter, return
            document.querySelector('#chat-message-submit').click();
        }
    };

    document.querySelector('#chat-message-submit').onclick = function (e) {
        const messageInputDom = document.querySelector('#chat-message-input');
        const message = messageInputDom.value;
        if (message) {
            chatSocket.send(JSON.stringify({
                'type': 'chat_message',
                'message': message,
                'username': username
            }));
            messageInputDom.value = '';
            // Stop typing status immediately after send
            chatSocket.send(JSON.stringify({
                'type': 'typing',
                'username': username,
                'is_typing': false
            }));
        }
    };

    // Typing indicator logic
    let typingTimer;
    const doneTypingInterval = 1000; // time in ms
    const input = document.getElementById('chat-message-input');

    input.addEventListener('input', () => {
        chatSocket.send(JSON.stringify({
            'type': 'typing',
            'username': username,
            'is_typing': true
        }));

        clearTimeout(typingTimer);
        typingTimer = setTimeout(doneTyping, doneTypingInterval);
    });

    function doneTyping() {
        chatSocket.send(JSON.stringify({
            'type': 'typing',
            'username': username,
            'is_typing': false
        }));
    }
</script>
{% endblock %}
